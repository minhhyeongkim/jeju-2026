<footer>
  <span>2026 제주도 가족여행</span> · 빠진 거 없지? 🧳
</footer>

<script>
  const STORAGE_KEY = 'jeju2026_checklist';

  function getState() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch { return {}; }
  }

  function saveState(state) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function updateProgress() {
    const items = document.querySelectorAll('.checklist-item');
    const total = items.length;
    const checked = document.querySelectorAll('.custom-checkbox.checked').length;
    document.getElementById('progressCount').textContent = checked + ' / ' + total + ' 완료';
    document.getElementById('progressFill').style.width = (total ? (checked / total * 100) : 0) + '%';
  }

  function applyState() {
    const state = getState();
    document.querySelectorAll('.checklist-item').forEach(item => {
      const key = item.dataset.key;
      const box = item.querySelector('.custom-checkbox');
      const label = item.querySelector('.item-label');
      const input = item.querySelector('input');
      if (state[key]) {
        box.classList.add('checked');
        label.classList.add('checked');
        input.checked = true;
      } else {
        box.classList.remove('checked');
        label.classList.remove('checked');
        input.checked = false;
      }
    });
    updateProgress();
  }

  document.querySelectorAll('.checklist-item').forEach(item => {
    item.addEventListener('click', function(e) {
      e.preventDefault();
      const key = this.dataset.key;
      const state = getState();
      state[key] = !state[key];
      saveState(state);
      applyState();
    });
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (confirm('모든 체크를 초기화할까요?')) {
      localStorage.removeItem(STORAGE_KEY);
      applyState();
    }
  });

  applyState();
</script>
